name: Launchpad contracts

on:
  pull_request:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:
    inputs:
      run_fork_tests:
        description: Verify against the Robinhood testnet V4 stack (read-only fork)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: launchpad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_FUZZ_RUNS: 1024
  FOUNDRY_INVARIANT_RUNS: 128
  FOUNDRY_INVARIANT_DEPTH: 64

jobs:
  foundry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Initialize pinned public modules
        run: |
          git submodule update --init \
            lib/core lib/lockers lib/token \
            lib/forge-std lib/openzeppelin-contracts

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.5

      - name: Check formatting
        run: forge fmt --check

      - name: Run deterministic offline launchpad tests
        run: forge test --no-match-path 'test/*Fork.t.sol' -vv

      - name: Enforce deployable sizes
        run: forge build --sizes

      - name: Verify live V4 stack on a pinned read-only fork
        if: github.event_name == 'workflow_dispatch' && inputs.run_fork_tests
        env:
          RPC_URL: https://rpc.testnet.chain.robinhood.com
        run: |
          test "$(cast chain-id --rpc-url "$RPC_URL")" = "46630"
          block=$(cast block-number --rpc-url "$RPC_URL")
          code=$(cast code 0x58daec3116aae6D93017bAAea7749052E8a04fA7 --rpc-url "$RPC_URL" --block "$block")
          test "$code" != "0x"
          echo "Testing Robinhood chain 46630 at block $block"
          forge test --match-path 'test/*Fork.t.sol' --fork-url "$RPC_URL" --fork-block-number "$block" -vv
