[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "@archliquid/core/=lib/core/src/",
  "@archliquid/lockers/=lib/lockers/src/",
  "@archliquid/token/=lib/token/src/",
]
